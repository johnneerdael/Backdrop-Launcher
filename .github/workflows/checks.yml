name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -W error -m unittest discover -s tool/release -p 'test_*.py' -v
      - run: python -W error -m unittest discover -s tool/native_benchmark -p 'test_*.py' -v

  native-home:
    name: Views and Compose Home benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native benchmark SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-36'' ''build-tools;35.0.0'''
      - name: Test, lint and build optimized Views and Compose benchmarks
        working-directory: native-benchmark
        run: ./gradlew :app:testReleaseUnitTest :compose:testReleaseUnitTest :app:lintRelease :compose:lintRelease :app:assembleRelease :compose:assembleRelease --console plain

  native-launcher:
    name: Kotlin and Compose production launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE_PASSWORD: ci-smoke-only
      SIGNING_KEY_ALIAS: ci-smoke
      SIGNING_KEY_PASSWORD: ci-smoke-only
      TMDB_API_KEY: ci-placeholder
      TRAKT_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install production Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-36'' ''build-tools;36.0.0'''
      - name: Create disposable smoke signing key
        run: |
          export BACKDROP_KEYSTORE_FILE="$RUNNER_TEMP/backdrop-ci.jks"
          echo "BACKDROP_KEYSTORE_FILE=$BACKDROP_KEYSTORE_FILE" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keystore "$BACKDROP_KEYSTORE_FILE" \
            -storetype JKS -storepass ci-smoke-only -keypass ci-smoke-only \
            -alias ci-smoke -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Disposable CI smoke build'
      - name: Test, lint and compile optimized production APK
        working-directory: native-launcher
        run: ./gradlew :app:testGithubReleaseUnitTest :app:lintGithubRelease :app:assembleGithubRelease --console plain
      - name: Remove disposable signing material
        if: always()
        run: rm -f "$BACKDROP_KEYSTORE_FILE"
