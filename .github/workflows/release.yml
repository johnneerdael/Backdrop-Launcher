name: Release

# A tag push never publishes. Only the exact successful main Checks source can ship.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA at the current main tip; its push Checks run must have passed'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backdrop-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  gate:
    if: >-
      github.repository == 'johnneerdael/Backdrop-Launcher' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ok: ${{ steps.plan.outputs.ok }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      # The gate itself always comes from trusted main, never a dispatch input ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate source, Checks, release history and notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          CHECKS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 tool/release/release.py plan --output build/release-plan.json --force
          else
            python3 tool/release/release.py plan --output build/release-plan.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.ok == 'true'
        with:
          name: release-plan
          path: build/release-plan.json
          retention-days: 7
          if-no-files-found: error

  package:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: build/release-metadata
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure Trakt backdrops
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_REDIRECT_URI: ${{ vars.TRAKT_REDIRECT_URI }}
        run: python3 tool/write_build_config.py
      - name: Restore signing key
        env:
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          names = ('SIGNING_JKS_FILE_BASE64', 'SIGNING_KEYSTORE_PASSWORD', 'SIGNING_KEY_ALIAS', 'SIGNING_KEY_PASSWORD')
          for name in names:
              if not os.environ.get(name, '').strip():
                  raise SystemExit(f'Missing repository secret: {name}')
          path = Path('android/app/upload-keystore.jks')
          data = base64.b64decode(''.join(os.environ['SIGNING_JKS_FILE_BASE64'].split()), validate=True)
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(data)
          PY
      - name: Build signed GitHub APKs
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          VERSION_CODE: ${{ needs.gate.outputs.code }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file=.dart_tool/trakt-config.json \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-name "$VERSION" --build-number "$VERSION_CODE"
      - name: Install APK signature verifier
        run: sdkmanager 'build-tools;36.0.0'
      - name: Verify signatures and prepare distribution
        run: |
          python3 tool/release/release.py package \
            --plan build/release-metadata/release-plan.json \
            --apk-dir build/app/outputs/apk/github/release \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --output build/release-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-assets
          path: build/release-dist/
          retention-days: 7
          if-no-files-found: error
      - name: Remove signing material and API build definitions
        if: always()
        run: rm -f android/app/upload-keystore.jks .dart_tool/trakt-config.json

  publish:
    needs: [gate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: build/release-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets
          path: build/release-dist
      - name: Recheck source and Checks, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/release/release.py publish \
            --plan build/release-metadata/release-plan.json \
            --dist build/release-dist
