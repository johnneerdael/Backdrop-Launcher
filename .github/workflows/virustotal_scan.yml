name: Optional VirusTotal scan

# Manual-only: GITHUB_TOKEN-created releases do not trigger release workflows.
# Production release automation has no dependency on this optional service.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published Backdrop release tag to submit (for example v1.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: virustotal-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'johnneerdael/Backdrop-Launcher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Explain skipped optional scan
        if: env.HAS_VT_KEY != 'true'
        run: echo 'Optional VIRUS_TOTAL_API_KEY is not configured; no scan or release edit performed.'
      - name: Validate tag and download APKs
        if: env.HAS_VT_KEY == 'true'
        run: |
          python3 - <<'PY'
          import os
          import re
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', os.environ['RELEASE_TAG']):
              raise SystemExit('Expected a stable Backdrop release tag (vMAJOR.MINOR.PATCH).')
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --pattern '*.apk'
      - name: Submit APKs to VirusTotal
        if: env.HAS_VT_KEY == 'true'
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: release-assets/*.apk
          request_rate: 4
      - name: Append analysis links to branded release notes
        if: steps.vt.outcome == 'success'
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > current-notes.md
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          marker = '<!-- virustotal-report -->'
          body = Path('current-notes.md').read_text().split(marker, 1)[0].rstrip()
          lines = [marker, '## VirusTotal analysis', '',
                   'APKs were submitted to VirusTotal. Reports may still be processing.', '',
                   '| Package | Analysis |', '| --- | --- |']
          for apk in sorted(Path('release-assets').glob('*.apk')):
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              lines.append(f'| {apk.name} | [View report](https://www.virustotal.com/gui/file/{digest}/detection) |')
          Path('updated-notes.md').write_text(body + '\n\n' + '\n'.join(lines) + '\n')
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file updated-notes.md
