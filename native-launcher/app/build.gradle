plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def productVersion = new Properties()
rootProject.file('version.properties').withInputStream { productVersion.load(it) }
def releaseVersion = providers.gradleProperty('releaseVersion').getOrElse(productVersion.getProperty('version'))
def releaseCode = providers.gradleProperty('releaseCode').getOrElse(productVersion.getProperty('code')).toInteger()
def quoted = { String value -> groovy.json.JsonOutput.toJson(value ?: '') }

android {
    namespace 'nl.neerdael.backdrop_launcher'
    compileSdk 36
    defaultConfig {
        applicationId 'nl.neerdael.backdrop_launcher'
        minSdk 23
        targetSdk 35
        versionCode releaseCode
        versionName releaseVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'TRAKT_CLIENT_ID', quoted(System.getenv('TRAKT_CLIENT_ID'))
        buildConfigField 'String', 'TMDB_API_KEY', quoted(System.getenv('TMDB_API_KEY'))
        buildConfigField 'String', 'TRAKT_REDIRECT_URI', quoted(System.getenv('TRAKT_REDIRECT_URI') ?: 'https://github.com/johnneerdael/arclauncher')
    }
    flavorDimensions += 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
            buildConfigField 'boolean', 'BENCHMARK', 'false'
            buildConfigField 'boolean', 'SELF_UPDATER', 'true'
        }
        benchmark {
            dimension 'distribution'
            applicationIdSuffix '.nativepreview'
            versionNameSuffix '-preview'
            buildConfigField 'boolean', 'BENCHMARK', 'true'
            buildConfigField 'boolean', 'SELF_UPDATER', 'false'
        }
    }
    buildFeatures { compose true; buildConfig true }
    signingConfigs {
        production {
            def keyFile = System.getenv('BACKDROP_KEYSTORE_FILE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig System.getenv('BACKDROP_KEYSTORE_FILE') ? signingConfigs.production : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/sharedAssets')
    splits {
        abi {
            enable false
            universalApk true
        }
    }
}

def sharedAssets = tasks.register('sharedAssets', Sync) {
    into layout.buildDirectory.dir('generated/sharedAssets')
    from('../../backdrops') { into 'backdrops'; include '*.jpg' }
    from('../../appicons') { into 'appicons'; include '*.png' }
    from('../../assets/branding/fonts') { into 'fonts'; include '*.ttf', '*OFL.txt' }
    from('../../lib/l10n') { into 'l10n'; include 'app_*.arb' }
}
tasks.named('preBuild').configure { dependsOn sharedAssets }
dependencies {
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.runtime:runtime:1.11.4'
    implementation 'androidx.tv:tv-material:1.1.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.11.4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.11.4'
}
