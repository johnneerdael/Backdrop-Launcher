name: flauncher
description: Backdrop Launcher. A cinematic home for Android TV.

version: 1.3.0+4127

environment:
  sdk: ">=3.11.0"
  flutter: 3.41.9

dependencies:
  flutter:
    sdk: flutter

  intl: any
  drift: ^2.14.1
  path: ^1.9.0
  path_provider: ^2.0.13
  package_info_plus: ^7.0.0
  provider: ^6.0.5
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.13
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  flutter_lints: ^5.0.0
  mockito: ^5.3.2
  drift_dev: ^2.5.2
  network_image_mock: ^2.1.1
  transparent_image: ^2.0.1

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any
  drift_local_storage_inspector: ^0.7.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - backdrops/
    - appicons/
    - assets/branding/mark.png
    - assets/branding/fonts/Inter-OFL.txt
    - assets/branding/fonts/SpaceGrotesk-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/branding/fonts/Inter.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/branding/fonts/SpaceGrotesk.ttf
